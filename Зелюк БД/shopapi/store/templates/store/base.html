<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ShopAPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <nav class="mb-4">
        <a href="{% url 'products_list' %}" class="btn btn-outline-primary">Товары</a>
        <a href="{% url 'product_add' %}" class="btn btn-outline-success">Добавить товар</a>
        <a href="{% url 'order_create' %}" class="btn btn-outline-warning">Создать заказ</a>
        <a href="{% url 'category_stats' %}" class="btn btn-outline-info">Статистика</a>
        <a href="{% url 'discount' %}" class="btn btn-outline-secondary">Скидка</a>
    </nav>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
